name: profile 3d

# Katki grafigini izometrik 3D olarak render eder.
# Ciktilar: profile-3d-contrib/ altinda
#   profile-night-view.svg          (koyu tema, animasyonlu)
#   profile-green-animate.svg       (acik tema, animasyonlu)
#   profile-season-animate.svg      (mevsimsel, animasyonlu)
#   profile-gitblock.svg            (blok gorunum)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: generate 3d contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: refresh 3d contribution graph"
          git push
