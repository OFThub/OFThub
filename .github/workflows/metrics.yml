name: metrics

# github-readme-stats.vercel.app (503) ve github-profile-trophy.vercel.app (402)
# paylasimli servisler oldugu icin kirilgan. Bu workflow ayni verileri KENDI
# repomuzda, kendi token'imizla uretip assets/metrics/ altina SVG olarak yazar.
#
# NOT: secrets.METRICS_TOKEN tanimlarsan (classic PAT, scope: read:user, repo)
# ozel repo istatistikleri ve takipci verileri de gelir. Tanimlamazsan
# GITHUB_TOKEN ile public veriler yine calisir.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Tek is + sirali adimlar: paralel calissalardi iki tema ayni anda
    # commit atip git push catismasi yaratirdi.
    steps:
      # ─────────── GENEL ISTATISTIKLER ───────────
      - name: stats (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/stats-dark.svg
          template: classic
          config_theme: dark
          config_timezone: Europe/Istanbul
          base: header, activity, community, repositories, metadata

      - name: stats (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/stats-light.svg
          template: classic
          config_theme: light
          config_timezone: Europe/Istanbul
          base: header, activity, community, repositories, metadata

      # ─────────── EN COK KULLANILAN DILLER ───────────
      - name: languages (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/langs-dark.svg
          config_theme: dark
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      - name: languages (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/langs-light.svg
          config_theme: light
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      # ─────────── ACHIEVEMENTS (kupalarin yerine) ───────────
      # Sadece GERCEKTEN kazanilmis basarimlari gosterir; kazanilmasi
      # imkansiz olanlar (ornegin 2010 oncesi hesap rozeti) hic cikmaz.
      - name: achievements (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/achievements-dark.svg
          config_theme: dark
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      - name: achievements (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/achievements-light.svg
          config_theme: light
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # ─────────── IZOMETRIK KATKI TAKVIMI ───────────
      - name: isocalendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/calendar-dark.svg
          config_theme: dark
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: isocalendar (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/calendar-light.svg
          config_theme: light
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
