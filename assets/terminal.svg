<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Terminal: whoami, focus.json ve iletisim bilgileri">
  <title>~/omerfaruk — whoami</title>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E18"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2338"/>
      <stop offset="100%" stop-color="#131A2B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="50%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="960" height="470" rx="14"/></clipPath>
    <filter id="tglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing masks: her satir soldan saga aciliyor -->
    <clipPath id="t1"><rect class="ty d1" x="30" y="76"  width="900" height="24"/></clipPath>
    <clipPath id="t2"><rect class="ty d2" x="30" y="106" width="900" height="24"/></clipPath>
    <clipPath id="t3"><rect class="ty d3" x="30" y="136" width="900" height="24"/></clipPath>
    <clipPath id="t4"><rect class="ty d4" x="30" y="166" width="900" height="24"/></clipPath>
    <clipPath id="t5"><rect class="ty d5" x="30" y="196" width="900" height="24"/></clipPath>
    <clipPath id="t6"><rect class="ty d6" x="30" y="226" width="900" height="24"/></clipPath>
    <clipPath id="t7"><rect class="ty d7" x="30" y="256" width="900" height="24"/></clipPath>
    <clipPath id="t8"><rect class="ty d8" x="30" y="286" width="900" height="24"/></clipPath>
    <clipPath id="t9"><rect class="ty d9" x="30" y="316" width="900" height="24"/></clipPath>
    <clipPath id="t10"><rect class="ty d10" x="30" y="346" width="900" height="24"/></clipPath>
    <clipPath id="t11"><rect class="ty d11" x="30" y="376" width="900" height="24"/></clipPath>

    <style>
      .mono { font-family:"JetBrains Mono","SF Mono","Consolas","Liberation Mono",monospace; font-size:15px; }
      .p  { fill:#FF2E63; }
      .c  { fill:#E6EDF7; }
      .g  { fill:#3DDC97; }
      .k  { fill:#00E5FF; }
      .s  { fill:#FFD79A; }
      .m  { fill:#6E7F9E; }

      @keyframes type  { 0% { transform: scaleX(0); } 3.4% { transform: scaleX(1); } 90% { transform: scaleX(1); } 92%,100% { transform: scaleX(0); } }
      @keyframes blink { 0%,48% { opacity:1; } 50%,100% { opacity:0; } }
      @keyframes scanY { 0% { transform: translateY(-120px); } 100% { transform: translateY(500px); } }
      @keyframes led   { 0%,100% { opacity:.45; } 50% { opacity:1; } }
      @keyframes edge  { 0% { opacity:.5; } 50% { opacity:1; } 100% { opacity:.5; } }

      .ty { transform-origin: 30px 0; animation: type 20s cubic-bezier(.25,0,.3,1) infinite; }
      .d1{animation-delay:0s} .d2{animation-delay:.75s} .d3{animation-delay:1.5s} .d4{animation-delay:2.1s}
      .d5{animation-delay:2.6s} .d6{animation-delay:3.2s} .d7{animation-delay:3.8s} .d8{animation-delay:4.3s}
      .d9{animation-delay:4.9s} .d10{animation-delay:5.6s} .d11{animation-delay:6.3s}

      .cur  { animation: blink 1s step-end infinite; }
      .scan { animation: scanY 6s linear infinite; }
      .led  { animation: led 3s ease-in-out infinite; }
      .eg   { animation: edge 4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#win)">
    <rect width="960" height="470" fill="url(#tbg)"/>

    <!-- baslik cubugu -->
    <rect width="960" height="44" fill="url(#bar)"/>
    <g>
      <circle class="led" cx="26" cy="22" r="6" fill="#FF5F57"/>
      <circle class="led" cx="48" cy="22" r="6" fill="#FEBC2E" style="animation-delay:.4s"/>
      <circle class="led" cx="70" cy="22" r="6" fill="#28C840" style="animation-delay:.8s"/>
    </g>
    <text class="mono m" x="480" y="27" text-anchor="middle" font-size="13">omerfaruk@github — zsh — 96×24</text>
    <rect x="0" y="43" width="960" height="1.5" fill="url(#edge)" class="eg"/>

    <!-- govde -->
    <g class="mono" filter="url(#tglow)">
      <g clip-path="url(#t1)"><text x="30" y="93"><tspan class="p">➜</tspan><tspan class="k" dx="10">~/omerfaruk</tspan><tspan class="c" dx="10">whoami</tspan></text></g>
      <g clip-path="url(#t2)"><text x="30" y="123" class="g">Ömer Faruk Türkdoğdu · Full-Stack Developer · Istanbul, TR</text></g>

      <g clip-path="url(#t3)"><text x="30" y="153"><tspan class="p">➜</tspan><tspan class="k" dx="10">~/omerfaruk</tspan><tspan class="c" dx="10">cat focus.json</tspan></text></g>
      <g clip-path="url(#t4)"><text x="30" y="183" class="m">{</text></g>
      <g clip-path="url(#t5)"><text x="30" y="213"><tspan class="k">  "building"</tspan><tspan class="m">: [</tspan><tspan class="s">"MangaStudio-Pro"</tspan><tspan class="m">, </tspan><tspan class="s">"PlannerAgent"</tspan><tspan class="m">],</tspan></text></g>
      <g clip-path="url(#t6)"><text x="30" y="243"><tspan class="k">  "learning"</tspan><tspan class="m">: [</tspan><tspan class="s">"LLM Agents"</tspan><tspan class="m">, </tspan><tspan class="s">"System Design"</tspan><tspan class="m">],</tspan></text></g>
      <g clip-path="url(#t7)"><text x="30" y="273"><tspan class="k">  "stack"</tspan><tspan class="m">: [</tspan><tspan class="s">"React"</tspan><tspan class="m">, </tspan><tspan class="s">"Next.js"</tspan><tspan class="m">, </tspan><tspan class="s">"Node"</tspan><tspan class="m">, </tspan><tspan class="s">".NET"</tspan><tspan class="m">, </tspan><tspan class="s">"Flutter"</tspan><tspan class="m">, </tspan><tspan class="s">"Python"</tspan><tspan class="m">]</tspan></text></g>
      <g clip-path="url(#t8)"><text x="30" y="303" class="m">}</text></g>

      <g clip-path="url(#t9)"><text x="30" y="333"><tspan class="p">➜</tspan><tspan class="k" dx="10">~/omerfaruk</tspan><tspan class="c" dx="10">./contact.sh --now</tspan></text></g>
      <g clip-path="url(#t10)"><text x="30" y="363"><tspan class="g">✔ </tspan><tspan class="c">linkedin.com/in/omerfarukoft</tspan><tspan class="m">  ·  </tspan><tspan class="c">oturkdogdu1@gmail.com</tspan></text></g>
      <g clip-path="url(#t11)"><text x="30" y="393"><tspan class="p">➜</tspan><tspan class="k" dx="10">~/omerfaruk</tspan></text></g>
      <rect class="cur" x="152" y="379" width="9" height="18" fill="#FF2E63"/>
    </g>

    <!-- alt bilgi seridi -->
    <rect x="0" y="426" width="960" height="44" fill="#0A101C"/>
    <text class="mono m" x="30" y="453" font-size="12.5">uptime: since 2021 &#160;&#160;|&#160;&#160; commits: ∞ &#160;&#160;|&#160;&#160; caffeine: [========--]</text>
    <text class="mono" x="930" y="453" font-size="12.5" text-anchor="end" fill="#3DDC97">● open to work</text>

    <!-- tarama efekti -->
    <g class="scan"><rect x="0" y="0" width="960" height="120" fill="url(#scan)"/></g>

    <rect x="0" y="0" width="960" height="470" rx="14" fill="none" stroke="#233149" stroke-width="1.5"/>
  </g>
</svg>
