  <title>Skill Matrix</title>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06070A"/><stop offset="100%" stop-color="#100609"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF2E45" stop-opacity="0"/><stop offset="35%" stop-color="#FF2E45"/><stop offset="70%" stop-color="#B00020"/><stop offset="100%" stop-color="#FF6B7A" stop-opacity="0"/></linearGradient>
    <clipPath id="scard"><rect width="960" height="532" rx="18"/></clipPath>
    <style>
      .mono { font-family:"JetBrains Mono","SF Mono","Consolas",monospace; }
      .sans { font-family:"Segoe UI",Inter,-apple-system,Helvetica,Arial,sans-serif; }
      .hd  { fill:#FBF6F7; font-size:18px; font-weight:700; letter-spacing:3.2px; }
      .sm  { fill:#8A7680; font-size:12px; }
      .cat { fill:#FF6B7A; font-size:12.5px; font-weight:700; letter-spacing:1.6px; }
      .ct  { fill:#FFD3D9; font-size:12px; }
      @keyframes chipIn { 0% { opacity:0; transform: translateY(10px); } 100% { opacity:1; transform: translateY(0); } }
      @keyframes pulse  { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes fadeUp { 0% { opacity:0; transform: translateY(8px); } 100% { opacity:1; transform: translateY(0); } }
      .in   { animation: fadeUp .7s ease both; }
      .dot  { animation: pulse 2.6s ease-in-out infinite; }
      .chip { animation: chipIn .55s cubic-bezier(.2,.85,.25,1) both; }
    </style>
  </defs>
