<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Omer Faruk Turkdogdu - Full-Stack Developer">
  <title>Ömer Faruk Türkdoğdu — Full-Stack Developer</title>

  <defs>
    <!-- ═══ PALET: siyah + kirmizi ═══ -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="55%" stop-color="#0C070A"/>
      <stop offset="100%" stop-color="#160509"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E45">
        <animate attributeName="stop-color" values="#FF2E45;#FF6B7A;#B00020;#FF2E45" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF6B7A">
        <animate attributeName="stop-color" values="#FF6B7A;#FFFFFF;#FF2E45;#FF6B7A" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#B00020">
        <animate attributeName="stop-color" values="#B00020;#FF2E45;#FF6B7A;#B00020" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E45" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FF2E45" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FF2E45" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E45" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF2E45"/>
      <stop offset="70%" stop-color="#B00020"/>
      <stop offset="100%" stop-color="#FF6B7A" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobA">
      <stop offset="0%" stop-color="#FF2E45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2E45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB">
      <stop offset="0%" stop-color="#B00020" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#B00020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC">
      <stop offset="0%" stop-color="#FF6B7A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B7A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#3A1620" stroke-width="1"/>
    </pattern>

    <radialGradient id="gridFade">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#gridFade)"/></mask>

    <clipPath id="card"><rect width="1200" height="380" rx="26"/></clipPath>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .mono { font-family:"JetBrains Mono","SF Mono","Consolas","Liberation Mono",monospace; }
      .sans { font-family:"Segoe UI",Inter,-apple-system,Helvetica,Arial,sans-serif; }

      @keyframes drift   { from { transform: translate(0,0); } to { transform: translate(-44px,-44px); } }
      @keyframes floatA  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(90px,40px); } }
      @keyframes floatB  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-110px,-30px); } }
      @keyframes floatC  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-55px); } }
      @keyframes sweepX  { 0% { transform: translateX(-460px); } 55%,100% { transform: translateX(1260px); } }
      @keyframes twinkle { 0%,100% { opacity:.12; } 50% { opacity:.95; } }
      @keyframes riseIn  { 0% { opacity:0; transform: translateY(26px); } 100% { opacity:1; transform: translateY(0); } }
      @keyframes fadeIn  { 0% { opacity:0; } 100% { opacity:1; } }
      @keyframes draw    { 0% { stroke-dashoffset: 1400; } 60%,100% { stroke-dashoffset: 0; } }
      @keyframes pulse   { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes blink   { 0%,45% { opacity:1; } 50%,100% { opacity:0; } }
      @keyframes glitch  { 0%,92%,100% { transform: translate(0,0); opacity:0; } 93% { transform: translate(-4px,2px); opacity:.75; } 95% { transform: translate(5px,-2px); opacity:.6; } 97% { transform: translate(-2px,0); opacity:.4; } }

      .grid   { animation: drift 3.6s linear infinite; }
      .bA     { animation: floatA 14s ease-in-out infinite; }
      .bB     { animation: floatB 18s ease-in-out infinite; }
      .bC     { animation: floatC 11s ease-in-out infinite; }
      .sweep  { animation: sweepX 7s cubic-bezier(.3,0,.2,1) infinite; }
      .star   { animation: twinkle 3s ease-in-out infinite; }
      .name   { animation: riseIn 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .outline{ stroke-dasharray: 1400; animation: draw 3.4s ease-out both; }
      .sub    { animation: riseIn 1s cubic-bezier(.2,.8,.2,1) .5s both; }
      .rule   { animation: fadeIn 1s ease .9s both; }
      .chip   { animation: riseIn .8s cubic-bezier(.2,.8,.2,1) both; }
      .c1{animation-delay:1.05s} .c2{animation-delay:1.2s} .c3{animation-delay:1.35s}
      .c4{animation-delay:1.5s} .c5{animation-delay:1.65s} .c6{animation-delay:1.8s}
      .brk    { stroke-dasharray: 200; animation: draw 2.2s ease-out .2s both; }
      .dot    { animation: pulse 2.4s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .gl     { animation: glitch 6s steps(1) infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <g filter="url(#soft)">
      <ellipse class="bA" cx="200" cy="90"  rx="260" ry="150" fill="url(#blobA)"/>
      <ellipse class="bB" cx="980" cy="300" rx="300" ry="170" fill="url(#blobB)"/>
      <ellipse class="bC" cx="640" cy="40"  rx="240" ry="130" fill="url(#blobC)"/>
    </g>

    <g mask="url(#gridMask)" opacity="0.55">
      <g class="grid"><rect x="-44" y="-44" width="1300" height="480" fill="url(#grid)"/></g>
    </g>

    <g fill="#FF8A98">
      <circle class="star" cx="86"   cy="62"  r="1.8" style="animation-delay:.0s"/>
      <circle class="star" cx="1130" cy="96"  r="2.2" style="animation-delay:.4s"/>
      <circle class="star" cx="300"  cy="330" r="1.6" style="animation-delay:.8s"/>
      <circle class="star" cx="760"  cy="58"  r="2.0" style="animation-delay:1.2s"/>
      <circle class="star" cx="1040" cy="340" r="1.7" style="animation-delay:1.6s"/>
      <circle class="star" cx="160"  cy="250" r="2.1" style="animation-delay:2.0s"/>
      <circle class="star" cx="520"  cy="352" r="1.5" style="animation-delay:2.4s"/>
      <circle class="star" cx="900"  cy="150" r="1.9" style="animation-delay:2.8s"/>
      <circle class="star" cx="1180" cy="220" r="1.6" style="animation-delay:.6s"/>
      <circle class="star" cx="40"   cy="180" r="1.8" style="animation-delay:1.4s"/>
    </g>

    <g fill="none" stroke="#FF2E45" stroke-width="2.5" opacity=".85" stroke-linecap="round">
      <path class="brk" d="M34 92 V50 a16 16 0 0 1 16 -16 H98"/>
      <path class="brk" d="M1166 92 V50 a16 16 0 0 0 -16 -16 H1102"/>
      <path class="brk" d="M34 288 V330 a16 16 0 0 0 16 16 H98" stroke="#B00020"/>
      <path class="brk" d="M1166 288 V330 a16 16 0 0 1 -16 16 H1102" stroke="#B00020"/>
    </g>

    <g class="sub">
      <circle class="dot" cx="60" cy="74" r="4" fill="#FF2E45"/>
      <text class="mono" x="76" y="79" font-size="14" fill="#94808A" letter-spacing="2.4">STATUS: ONLINE &#183; BUILDING SOMETHING</text>
    </g>

    <g class="name" text-anchor="middle">
      <text class="sans" x="600" y="186" font-size="72" font-weight="800" letter-spacing="1" fill="url(#nameGrad)" filter="url(#glow)">ÖMER FARUK</text>
      <text class="sans outline" x="600" y="186" font-size="72" font-weight="800" letter-spacing="1" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1">ÖMER FARUK</text>
      <text class="sans gl" x="600" y="186" font-size="72" font-weight="800" letter-spacing="1" fill="#FF6B7A" opacity="0">ÖMER FARUK</text>
    </g>

    <g class="rule"><rect x="300" y="206" width="600" height="2" fill="url(#ruleGrad)"/></g>

    <g class="sub" text-anchor="middle">
      <text class="mono" x="600" y="248" font-size="21" fill="#F2EFF1" letter-spacing="5.5" filter="url(#glowSm)">FULL-STACK DEVELOPER</text>
      <text class="mono cursor" x="600" y="248" font-size="21" fill="#FF2E45" dx="176">_</text>
    </g>

    <g class="mono" font-size="13.5" text-anchor="middle">
      <g class="chip c1"><rect x="230" y="284" width="120" height="32" rx="16" fill="#FF2E45" fill-opacity=".14" stroke="#FF2E45" stroke-opacity=".55"/><text x="290" y="305" fill="#FFB8C1">TypeScript</text></g>
      <g class="chip c2"><rect x="362" y="284" width="104" height="32" rx="16" fill="#FF6B7A" fill-opacity=".10" stroke="#FF6B7A" stroke-opacity=".45"/><text x="414" y="305" fill="#FFC9CF">React</text></g>
      <g class="chip c3"><rect x="478" y="284" width="112" height="32" rx="16" fill="#B00020" fill-opacity=".22" stroke="#B00020" stroke-opacity=".65"/><text x="534" y="305" fill="#FFA8B3">Node.js</text></g>
      <g class="chip c4"><rect x="602" y="284" width="108" height="32" rx="16" fill="#FF2E45" fill-opacity=".14" stroke="#FF2E45" stroke-opacity=".55"/><text x="656" y="305" fill="#FFB8C1">Flutter</text></g>
      <g class="chip c5"><rect x="722" y="284" width="140" height="32" rx="16" fill="#FF6B7A" fill-opacity=".10" stroke="#FF6B7A" stroke-opacity=".45"/><text x="792" y="305" fill="#FFC9CF">Python / AI</text></g>
      <g class="chip c6"><rect x="874" y="284" width="96" height="32" rx="16" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".28"/><text x="922" y="305" fill="#E4DDE0">.NET</text></g>
    </g>

    <g class="sweep" opacity=".38">
      <rect width="170" height="380" fill="url(#sweep)" transform="skewX(-14)"/>
    </g>

    <rect width="1200" height="3" fill="url(#ruleGrad)"/>
    <rect width="1200" height="380" rx="26" fill="none" stroke="#3A1620" stroke-width="1.5"/>
  </g>
</svg>
